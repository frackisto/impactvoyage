services:
  db:
    image: postgres:16-alpine
    container_name: voyage_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-voyage_db}
      POSTGRES_USER: ${DATABASE_USER:-voyage_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-voyage_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: voyage_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: voyage_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
    container_name: voyage_celery
    restart: unless-stopped
    command: celery -A config worker -l info
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
    container_name: voyage_celery_beat
    restart: unless-stopped
    # Planificateur des tâches périodiques (CELERY_BEAT_SCHEDULE) ; le fichier
    # d'état reste dans le conteneur pour ne pas polluer le dossier monté.
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        API_URL: http://backend:8000/api/v1
    container_name: voyage_frontend
    restart: unless-stopped
    environment:
      # Adresse interne du backend, vue depuis le serveur Next.js (jamais par le navigateur).
      API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # --- Ajouté dans une phase suivante ---
  # nginx:      # Phase 24 « Dockerisation et déploiement »

volumes:
  postgres_data:
  static_volume:
  media_volume:
