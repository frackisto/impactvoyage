# Médias téléversés dans Django (architecture § 8), servis depuis le volume en lecture
# seule. Django n'accepte que des images JPEG, PNG et WebP renommées en UUID : tout autre
# fichier est refusé, rien n'est jamais exécuté ni interprété comme une page.
location ~* ^/media/(.+\.(?:jpe?g|png|webp))$ {
    alias /srv/media/$1;
    include snippets/hsts.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header Cache-Control "public, max-age=2592000" always;
    access_log off;
}
location /media/ {
    return 404;
}
