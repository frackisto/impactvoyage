# En-têtes transmis aux applications. X-Real-IP et X-Forwarded-For sont remplacés, jamais
# complétés : ce que le client envoie dans ces en-têtes n'est pas fiable.
#   Next.js lit X-Real-IP (lib/api/backend.ts) ; Django lit X-Forwarded-For (NUM_PROXIES=1).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
proxy_connect_timeout 5s;
